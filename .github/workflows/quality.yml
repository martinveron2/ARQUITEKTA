name: Quality engine
on:
  push:
    branches: [main]
    paths: ['modules/quality/**', 'src/**', 'package*.json', '.github/workflows/quality.yml']
  pull_request:
    paths: ['modules/quality/**', 'src/**', 'package*.json', '.github/workflows/quality.yml']
permissions:
  contents: read
jobs:
  browser-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modules/quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
        env:
          QUALITY_TEST_EVIDENCE: ${{ github.workspace }}/quality-test-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-test-evidence
          path: quality-test-evidence
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
  portable-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t arquitekta-quality modules/quality
      - run: docker run --rm --entrypoint python arquitekta-quality -c "from arquitekta_quality.runner import run; from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); b.close(); p.stop(); print('portable Chromium OK')"
